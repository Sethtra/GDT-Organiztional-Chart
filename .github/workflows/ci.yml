name: CI Quality Gate

on:
  push:
    branches: [main, Tra]
  pull_request:
    branches: [main, Tra]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets['VITE_SUPABASE_URL'] || 'https://ojuyrhwmgwefwdxdmisr.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets['VITE_SUPABASE_ANON_KEY'] || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdXlyaHdtZ3dlZndkeGRtaXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjI5MTYsImV4cCI6MjA5ODYzODkxNn0.Skj_R5UiMHynSivGQ3Joue0KbsLWWm50Hc8x41HRz3k' }}
      VITE_HR_FEATURES_ENABLED: 'true'
      VITE_CHART_VERSION_WRITES_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting & linting (Oxlint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & integration test suite
        run: npm run test

      - name: Verify production build
        run: npm run build
