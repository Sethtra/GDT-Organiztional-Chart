name: CI Quality Gate

on:
  push:
    branches: [main, Tra]
  pull_request:
    branches: [main, Tra]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting & linting (Oxlint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & integration test suite
        run: npm run test

      - name: Verify production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_HR_FEATURES_ENABLED: 'true'
          VITE_CHART_VERSION_WRITES_ENABLED: 'false'
